<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
    <aside class="app-sidebar">
        <div class="app-brand">School Manager</div>
        <div class="app-brand-sub">Quản lý đào tạo</div>
        <ul class="app-menu">
            <li><a href="/index.html" data-page="home">Trang chủ</a></li>
            <li><a href="/students.html" data-page="students" class="active">Sinh viên</a></li>
            <li><a href="/majors.html" data-page="majors">Ngành học</a></li>
            <li><a href="/training-programs.html" data-page="training-programs">CTĐT</a></li>
            <li><a href="/courses.html" data-page="courses">Học phần</a></li>
            <li><a href="/program-courses.html" data-page="program-courses">HP trong CTĐT</a></li>
        </ul>
    </aside>

    <main class="app-main">
        <header class="page-header">
            <h1>Quản lý sinh viên</h1>
            <p>Tra cứu, thêm mới và chỉnh sửa thông tin sinh viên.</p>
        </header>

        <div id="formAlert" class="alert-banner"></div>

        <section class="panel">
            <div class="toolbar">
                <input type="text" id="search" class="form-control toolbar-grow"
                       placeholder="Tìm theo tên..." onkeyup="onSearchKey()">
            </div>
        </section>

        <section class="panel table-panel">
            <div class="table-responsive">
                <table class="table table-bordered table-sm mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>
        </section>

        <section class="panel form-section">
            <div class="panel-title" id="formTitle">Thêm sinh viên</div>
            <p class="text-muted small mb-3" id="idHint">UUID do hệ thống tạo khi thêm mới.</p>
            <input id="id" type="hidden">
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label">Tên *</label>
                    <input id="name" class="form-control" placeholder="Nguyễn Văn A">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email *</label>
                    <input id="email" type="email" class="form-control" placeholder="sv@email.com">
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary" onclick="saveStudent()">Lưu</button>
                <button class="btn btn-outline-secondary ms-2" onclick="resetForm()">Hủy</button>
            </div>
        </section>
    </main>
</div>

<script src="/js/app.js"></script>
<script>
const API = App.baseUrl + "/api/students";
App.setActiveNav("students");

function renderRows(data) {
    let html = "";
    data.forEach((s) => {
        const idAttr = App.escapeAttr(String(s.id));
        html += `<tr>
            <td><small>${App.escapeHtml(String(s.id).slice(0, 8))}…</small></td>
            <td>${App.escapeHtml(s.name)}</td>
            <td>${App.escapeHtml(s.email)}</td>
            <td class="text-nowrap">
                <button type="button" class="btn btn-warning btn-sm" data-action="edit" data-id="${idAttr}">Sửa</button>
                <button type="button" class="btn btn-danger btn-sm ms-1" data-action="delete" data-id="${idAttr}">Xóa</button>
            </td></tr>`;
    });
    document.getElementById("studentTable").innerHTML =
        html || '<tr><td colspan="4" class="text-center text-muted py-4">Chưa có dữ liệu</td></tr>';
}

document.getElementById("studentTable").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "edit") {
        try {
            const s = await App.fetchJson(`${API}/${encodeURIComponent(id)}`);
            document.getElementById("id").value = s.id;
            document.getElementById("name").value = s.name ?? "";
            document.getElementById("email").value = s.email ?? "";
            document.getElementById("formTitle").innerText = "Cập nhật sinh viên";
            App.hideBanner("formAlert");
        } catch (err) {
            App.toast(err.message, "error");
        }
    } else if (btn.dataset.action === "delete") {
        if (!confirm("Xóa sinh viên này?")) return;
        try {
            await App.fetchJson(`${API}/${encodeURIComponent(id)}`, { method: "DELETE" });
            App.toast("Đã xóa sinh viên");
            loadStudents();
        } catch (err) {
            App.toast(err.message, "error");
        }
    }
});

async function loadStudents() {
    try {
        const data = await App.fetchJson(API);
        renderRows(data);
    } catch (err) {
        App.showBanner("formAlert", err.message);
    }
}

async function saveStudent() {
    const idVal = document.getElementById("id").value;
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    if (!name || !email) {
        App.showBanner("formAlert", "Vui lòng nhập tên và email.");
        return;
    }
    App.hideBanner("formAlert");
    const url = idVal ? `${API}/${encodeURIComponent(idVal)}` : API;
    const method = idVal ? "PUT" : "POST";
    try {
        await App.fetchJson(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email })
        });
        App.toast(idVal ? "Cập nhật thành công" : "Thêm mới thành công");
        resetForm();
        loadStudents();
    } catch (err) {
        App.showBanner("formAlert", err.message);
    }
}

function onSearchKey() {
    const name = document.getElementById("search").value.trim();
    if (!name) { loadStudents(); return; }
    App.fetchJson(`${API}/search?name=${encodeURIComponent(name)}`)
        .then(renderRows)
        .catch((err) => App.toast(err.message, "error"));
}

function resetForm() {
    document.getElementById("id").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("formTitle").innerText = "Thêm sinh viên";
    App.hideBanner("formAlert");
}

loadStudents();
</script>
</body>
</html>
