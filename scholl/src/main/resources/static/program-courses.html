<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Học phần trong CTĐT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
    <aside class="app-sidebar">
        <div class="app-brand">School Manager</div>
        <div class="app-brand-sub">Quản lý đào tạo</div>
        <ul class="app-menu">
            <li><a href="/index.html" data-page="home">Trang chủ</a></li>
            <li><a href="/students.html" data-page="students">Sinh viên</a></li>
            <li><a href="/majors.html" data-page="majors">Ngành học</a></li>
            <li><a href="/training-programs.html" data-page="training-programs">CTĐT</a></li>
            <li><a href="/courses.html" data-page="courses">Học phần</a></li>
            <li><a href="/program-courses.html" data-page="program-courses" class="active">HP trong CTĐT</a></li>
        </ul>
    </aside>

    <main class="app-main">
        <header class="page-header">
            <h1>Học phần trong chương trình đào tạo</h1>
            <p>Bảng <code>training_program_courses</code> — liên kết CTĐT và học phần.</p>
        </header>

        <div id="formAlert" class="alert-banner"></div>

        <div class="split-layout">
            <div>
                <section class="panel">
                    <div class="toolbar">
                        <input type="text" id="search" class="form-control toolbar-grow" placeholder="Tìm mã/tên học phần...">
                        <select id="filterProgram" class="form-select"><option value="">Tất cả CTĐT</option></select>
                        <select id="filterSemester" class="form-select"><option value="">Tất cả học kỳ</option></select>
                        <select id="filterActive" class="form-select">
                            <option value="">Mọi trạng thái</option>
                            <option value="true">Chỉ đang hoạt động</option>
                        </select>
                        <button class="btn btn-primary btn-sm" onclick="applyFilters()">Áp dụng</button>
                    </div>
                </section>

                <section class="panel table-panel">
                    <div class="table-responsive">
                        <table class="table table-bordered table-sm mb-0">
                            <thead>
                            <tr>
                                <th>CTĐT</th>
                                <th>Mã HP</th>
                                <th>Tên HP</th>
                                <th>Học kỳ</th>
                                <th>TC</th>
                                <th>BB</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="dataTable"></tbody>
                        </table>
                    </div>
                    <div class="pagination-bar">
                        <span id="pageInfo">—</span>
                        <div class="btn-group">
                            <button class="btn btn-outline-secondary btn-sm" id="btnPrev" onclick="changePage(-1)">Trước</button>
                            <button class="btn btn-outline-secondary btn-sm" id="btnNext" onclick="changePage(1)">Sau</button>
                        </div>
                    </div>
                </section>
            </div>

            <section class="panel form-section">
                <div class="panel-title" id="formTitle">Thêm học phần vào CTĐT</div>
                <input id="id" type="hidden">

                <div class="mb-2">
                    <label class="form-label">Chương trình đào tạo *</label>
                    <select id="trainingProgramId" class="form-select"></select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Học phần *</label>
                    <select id="courseId" class="form-select"></select>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label">Mã HP (ghi đè)</label>
                        <input id="courseCode" class="form-control" maxlength="100">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Tên HP (ghi đè)</label>
                        <input id="courseName" class="form-control" maxlength="255">
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Học kỳ</label>
                    <select id="semesterId" class="form-select"><option value="">-- Không chọn --</option></select>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label">Mã học kỳ</label>
                        <input id="semesterCode" class="form-control" maxlength="100">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Năm học</label>
                        <input id="academicYear" class="form-control" maxlength="20">
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label">Số tín chỉ</label>
                        <input id="credits" type="number" step="0.1" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Thứ tự</label>
                        <input id="sortOrder" type="number" class="form-control">
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Nhóm</label>
                    <input id="groupCode" class="form-control" maxlength="50">
                </div>
                <div class="mb-2">
                    <label class="form-label">Học phần tiên quyết</label>
                    <select id="prerequisiteCourseId" class="form-select">
                        <option value="">-- Không có --</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Ghi chú</label>
                    <input id="note" class="form-control" maxlength="500">
                </div>
                <div class="mb-2">
                    <label class="form-label">Trạng thái</label>
                    <input id="status" class="form-control" maxlength="50" placeholder="ACTIVE">
                </div>
                <div class="mb-2">
                    <label class="form-label">Người thao tác</label>
                    <input id="actor" type="text" class="form-control" maxlength="255">
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="isRequired" checked>
                    <label class="form-check-label" for="isRequired">Học phần bắt buộc</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="isActive" checked>
                    <label class="form-check-label" for="isActive">Đang hoạt động</label>
                </div>

                <button class="btn btn-primary w-100 mb-2" onclick="saveItem()">Lưu</button>
                <button class="btn btn-outline-secondary w-100" onclick="resetForm()">Hủy / Thêm mới</button>
            </section>
        </div>
    </main>
</div>

<script src="/js/app.js"></script>
<script>
const API = App.baseUrl + "/api/training-program-courses";
const TP_API = App.baseUrl + "/api/training-programs";
const COURSE_API = App.baseUrl + "/api/courses";
const SEM_API = App.baseUrl + "/api/semesters";
App.setActiveNav("program-courses");

let state = { page: 0, size: 8, totalPages: 0 };
let coursesCache = [];

function buildQuery() {
    const params = new URLSearchParams();
    params.set("page", state.page);
    params.set("size", state.size);
    params.set("sort", "sortOrder");
    const q = document.getElementById("search").value.trim();
    if (q) params.set("q", q);
    const prog = document.getElementById("filterProgram").value;
    if (prog) params.set("trainingProgramId", prog);
    const sem = document.getElementById("filterSemester").value;
    if (sem) params.set("semesterId", sem);
    if (document.getElementById("filterActive").value === "true") params.set("activeOnly", "true");
    return `${API}?${params}`;
}

function renderRows(items) {
    let html = "";
    items.forEach((r) => {
        const idAttr = App.escapeAttr(String(r.id));
        const prog = r.trainingProgram ? App.escapeHtml(r.trainingProgram.code) : "—";
        html += `<tr>
            <td><small>${prog}</small></td>
            <td><code>${App.escapeHtml(r.courseCode || r.course?.code || "")}</code></td>
            <td>${App.escapeHtml(r.courseName || r.course?.name || "")}</td>
            <td><small>${App.escapeHtml(r.semesterCode || r.semester?.code || "—")}</small></td>
            <td>${r.credits ?? "—"}</td>
            <td>${r.isRequired ? "✓" : "—"}</td>
            <td class="text-nowrap">
                <button type="button" class="btn btn-warning btn-sm" data-action="edit" data-id="${idAttr}">Sửa</button>
                <button type="button" class="btn btn-danger btn-sm" data-action="delete" data-id="${idAttr}">Xóa</button>
            </td></tr>`;
    });
    document.getElementById("dataTable").innerHTML =
        html || '<tr><td colspan="7" class="text-center text-muted py-4">Không có dữ liệu</td></tr>';
}

async function loadList() {
    try {
        const data = await App.fetchJson(buildQuery());
        renderRows(data.content);
        state.totalPages = data.totalPages;
        document.getElementById("pageInfo").textContent =
            `Trang ${data.page + 1} / ${Math.max(data.totalPages, 1)} · ${data.totalElements} bản ghi`;
        document.getElementById("btnPrev").disabled = data.page <= 0;
        document.getElementById("btnNext").disabled = data.page >= data.totalPages - 1;
        App.hideBanner("formAlert");
    } catch (err) {
        App.showBanner("formAlert", err.message);
    }
}

function applyFilters() { state.page = 0; loadList(); }
function changePage(d) {
    const next = state.page + d;
    if (next < 0 || next >= state.totalPages) return;
    state.page = next;
    loadList();
}

function fillSelect(sel, items, valueKey, labelFn, emptyLabel) {
    sel.innerHTML = emptyLabel ? `<option value="">${emptyLabel}</option>` : "";
    items.forEach((item) => {
        sel.innerHTML += `<option value="${App.escapeAttr(String(item[valueKey]))}">${labelFn(item)}</option>`;
    });
}

async function loadLookups() {
    const [programs, courses, semesters] = await Promise.all([
        App.fetchJson(`${TP_API}?size=50`),
        App.fetchJson(`${COURSE_API}?size=100`),
        App.fetchJson(SEM_API)
    ]);
    coursesCache = courses.content;
    fillSelect(document.getElementById("trainingProgramId"), programs.content, "id",
        (p) => `${App.escapeHtml(p.code)} — ${App.escapeHtml(p.name)}`, "-- Chọn CTĐT --");
    fillSelect(document.getElementById("filterProgram"), programs.content, "id",
        (p) => `${App.escapeHtml(p.code)} — ${App.escapeHtml(p.name)}`, "Tất cả CTĐT");
    fillSelect(document.getElementById("courseId"), courses.content, "id",
        (c) => `${App.escapeHtml(c.code)} — ${App.escapeHtml(c.name)}`, "-- Chọn học phần --");
    fillSelect(document.getElementById("prerequisiteCourseId"), courses.content, "id",
        (c) => `${App.escapeHtml(c.code)} — ${App.escapeHtml(c.name)}`, "-- Không có --");
    fillSelect(document.getElementById("semesterId"), semesters, "id",
        (s) => `${App.escapeHtml(s.code)} — ${App.escapeHtml(s.name)}`, "-- Không chọn --");
    fillSelect(document.getElementById("filterSemester"), semesters, "id",
        (s) => App.escapeHtml(s.code), "Tất cả học kỳ");
}

document.getElementById("courseId").addEventListener("change", () => {
    const c = coursesCache.find((x) => String(x.id) === document.getElementById("courseId").value);
    if (!c) return;
    if (!document.getElementById("courseCode").value) document.getElementById("courseCode").value = c.code;
    if (!document.getElementById("courseName").value) document.getElementById("courseName").value = c.name;
    if (!document.getElementById("credits").value && c.credits != null) {
        document.getElementById("credits").value = c.credits;
    }
});

function parseNum(id) {
    const v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
}

function buildPayload() {
    const sem = document.getElementById("semesterId").value;
    const prereq = document.getElementById("prerequisiteCourseId").value;
    return {
        trainingProgramId: document.getElementById("trainingProgramId").value || null,
        courseId: document.getElementById("courseId").value || null,
        courseCode: document.getElementById("courseCode").value.trim() || null,
        courseName: document.getElementById("courseName").value.trim() || null,
        semesterId: sem || null,
        semesterCode: document.getElementById("semesterCode").value.trim() || null,
        academicYear: document.getElementById("academicYear").value.trim() || null,
        isRequired: document.getElementById("isRequired").checked,
        groupCode: document.getElementById("groupCode").value.trim() || null,
        credits: parseNum("credits"),
        prerequisiteCourseId: prereq || null,
        note: document.getElementById("note").value.trim() || null,
        sortOrder: parseNum("sortOrder"),
        status: document.getElementById("status").value.trim() || null,
        isActive: document.getElementById("isActive").checked,
        actor: document.getElementById("actor").value.trim() || null
    };
}

async function saveItem() {
    App.hideBanner("formAlert");
    const idVal = document.getElementById("id").value;
    const url = idVal ? `${API}/${encodeURIComponent(idVal)}` : API;
    try {
        await App.fetchJson(url, {
            method: idVal ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildPayload())
        });
        App.toast(idVal ? "Cập nhật thành công" : "Thêm thành công");
        resetForm();
        loadList();
    } catch (err) {
        App.showBanner("formAlert", err.message);
    }
}

function resetForm() {
    document.getElementById("id").value = "";
    ["courseCode","courseName","semesterCode","academicYear","credits","sortOrder","groupCode","note","status","actor"]
        .forEach((id) => { document.getElementById(id).value = ""; });
    document.getElementById("trainingProgramId").value = "";
    document.getElementById("courseId").value = "";
    document.getElementById("semesterId").value = "";
    document.getElementById("prerequisiteCourseId").value = "";
    document.getElementById("isRequired").checked = true;
    document.getElementById("isActive").checked = true;
    document.getElementById("formTitle").innerText = "Thêm học phần vào CTĐT";
    App.hideBanner("formAlert");
}

document.getElementById("dataTable").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "edit") {
        const r = await App.fetchJson(`${API}/${encodeURIComponent(id)}`);
        document.getElementById("id").value = r.id;
        document.getElementById("trainingProgramId").value = r.trainingProgram?.id ?? "";
        document.getElementById("courseId").value = r.course?.id ?? "";
        document.getElementById("courseCode").value = r.courseCode ?? "";
        document.getElementById("courseName").value = r.courseName ?? "";
        document.getElementById("semesterId").value = r.semester?.id ?? "";
        document.getElementById("semesterCode").value = r.semesterCode ?? "";
        document.getElementById("academicYear").value = r.academicYear ?? "";
        document.getElementById("credits").value = r.credits ?? "";
        document.getElementById("sortOrder").value = r.sortOrder ?? "";
        document.getElementById("groupCode").value = r.groupCode ?? "";
        document.getElementById("prerequisiteCourseId").value = r.prerequisiteCourse?.id ?? "";
        document.getElementById("note").value = r.note ?? "";
        document.getElementById("status").value = r.status ?? "";
        document.getElementById("isRequired").checked = !!r.isRequired;
        document.getElementById("isActive").checked = !!r.isActive;
        document.getElementById("actor").value = r.updatedBy || r.createdBy || "";
        document.getElementById("formTitle").innerText = "Cập nhật học phần trong CTĐT";
    } else if (btn.dataset.action === "delete") {
        if (!confirm("Xóa mềm bản ghi này?")) return;
        const actor = document.getElementById("actor").value.trim();
        let url = `${API}/${encodeURIComponent(id)}`;
        if (actor) url += `?deletedBy=${encodeURIComponent(actor)}`;
        await App.fetchJson(url, { method: "DELETE" });
        App.toast("Đã xóa mềm");
        loadList();
    }
});

document.getElementById("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") applyFilters();
});

loadLookups().then(loadList);
</script>
</body>
</html>
